<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holly gefunden</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 25px;
    text-align: center;
    color: #1d1d1f;
}

.card {
    max-width: 500px;
    margin: 30px auto;
    background: white;
    padding: 30px 22px;
    border-radius: 24px;
    box-shadow: 0 5px 25px rgba(0,0,0,.10);
}

.dog {
    font-size: 70px;
}

h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

p {
    font-size: 18px;
    line-height: 1.5;
}

.button {
    display: block;
    margin: 15px 0;
    padding: 18px;
    border-radius: 15px;
    text-decoration: none;
    color: white;
    font-size: 19px;
    font-weight: bold;
}

.sms {
    background: #34c759;
}

.call {
    background: #007aff;
}

.number {
    margin-top: 25px;
    font-size: 16px;
    color: #666;
}
</style>
</head>

<body>

<div class="card">

<div class="dog">🐶</div>

<h1>Sie haben Holly gefunden!</h1>

<p>
Vielen Dank, dass Sie Holly gefunden haben. ❤️
</p>

<p>
Bitte kontaktieren Sie uns so schnell wie möglich.
</p>

<a class="button sms" href="#" onclick="sendSMS(); return false;">
💬 SMS senden
</a>

<a class="button call" href="tel:+491724160461">
📞 Jetzt anrufen
</a>

<div class="number">
Telefon: +49 172 4160461
</div>

</div>

<script>
function sendSMS() {

    const text = 'Hallo, ich habe Ihren Hund "Holly" gefunden!\n\nBitte melden Sie sich dringend bei mir!\n\nHolly Krämer\nRheinstraße 26\n63071 Offenbach am Main';

    const number = '+491724160461';

    const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

    if (isiOS) {
        window.location.href =
            'sms:' + number + '&body=' + encodeURIComponent(text);
    } else {
        window.location.href =
            'sms:' + number + '?body=' + encodeURIComponent(text);
    }
}
</script>

</body>
</html>
